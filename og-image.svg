<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="0.3" cy="0.3" r="1">
      <stop offset="0%" stop-color="#1a2050"/>
      <stop offset="60%" stop-color="#0a0e2a"/>
      <stop offset="100%" stop-color="#050818"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.32" cy="0.25" r="0.9">
      <stop offset="0%" stop-color="#fff7d8"/>
      <stop offset="35%" stop-color="#e9c97a"/>
      <stop offset="75%" stop-color="#9b6f2d"/>
      <stop offset="100%" stop-color="#5a3f15"/>
    </radialGradient>
    <radialGradient id="hair" cx="0.4" cy="0.3">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="60%" stop-color="#ffd54a"/>
      <stop offset="100%" stop-color="#b88a00"/>
    </radialGradient>
    <radialGradient id="skin" cx="0.5" cy="0.4">
      <stop offset="0%" stop-color="#ffeed5"/>
      <stop offset="100%" stop-color="#f4cfa6"/>
    </radialGradient>
    <linearGradient id="scarf" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#f59f00"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5fa080"/>
      <stop offset="100%" stop-color="#2c5e4a"/>
    </linearGradient>
    <radialGradient id="fox" cx="0.4" cy="0.3">
      <stop offset="0%" stop-color="#ffbb77"/>
      <stop offset="60%" stop-color="#e07b2a"/>
      <stop offset="100%" stop-color="#a04510"/>
    </radialGradient>
    <radialGradient id="rose" cx="0.4" cy="0.3">
      <stop offset="0%" stop-color="#ff8a7a"/>
      <stop offset="60%" stop-color="#d83a30"/>
      <stop offset="100%" stop-color="#8a1c14"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffd54a" opacity="0.9">
    <circle cx="120" cy="80" r="2.5"/>
    <circle cx="300" cy="50" r="1.8"/>
    <circle cx="950" cy="90" r="2.2"/>
    <circle cx="1100" cy="200" r="1.6"/>
    <circle cx="80" cy="350" r="2"/>
    <circle cx="200" cy="500" r="1.7"/>
    <circle cx="1050" cy="450" r="2.3"/>
    <circle cx="1150" cy="540" r="1.5"/>
    <circle cx="500" cy="60" r="1.4"/>
    <circle cx="700" cy="40" r="1.8"/>
    <path d="M 160,220 l 3,10 10,0 -8,6 3,10 -8,-6 -8,6 3,-10 -8,-6 10,0 Z" opacity="0.85"/>
    <path d="M 1080,320 l 3,10 10,0 -8,6 3,10 -8,-6 -8,6 3,-10 -8,-6 10,0 Z" opacity="0.85"/>
  </g>

  <!-- title text on the left -->
  <g transform="translate(80,160)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="22" fill="#ffd54a" letter-spacing="8" font-weight="700">UM CONVITE ESTELAR</text>
    <text x="0" y="100" font-family="Georgia, serif" font-size="110" fill="#fff" font-weight="700">José Pedro</text>
    <text x="0" y="160" font-family="cursive, Georgia" font-size="48" fill="#ffd54a" font-style="italic">1 ano</text>
    <line x1="0" y1="200" x2="120" y2="200" stroke="#ffd54a" stroke-width="2"/>
    <text x="0" y="240" font-family="Georgia, serif" font-size="26" fill="#fff" opacity="0.9">24 · 05 · 2026  •  18:30</text>
    <text x="0" y="290" font-family="Georgia, serif" font-size="18" fill="#fff" opacity="0.7" font-style="italic">"O essencial é invisível aos olhos."</text>
    <text x="0" y="380" font-family="Georgia, serif" font-size="14" fill="#ffd54a" letter-spacing="6">✦ B612 ✦</text>
  </g>

  <!-- scene on the right -->
  <g transform="translate(820, 100)">
    <!-- planet halo -->
    <circle cx="180" cy="380" r="225" fill="#ffd54a" opacity="0.13" filter="blur(12px)"/>
    <!-- planet -->
    <circle cx="180" cy="380" r="180" fill="url(#planet)" stroke="#3a2810" stroke-width="3"/>
    <ellipse cx="140" cy="290" rx="80" ry="25" fill="#fff" opacity="0.22"/>
    <path d="M 30,360 Q 110,378 200,372 Q 280,365 320,385" fill="none" stroke="#5a3f15" stroke-width="1.5" opacity="0.55"/>
    <circle cx="100" cy="410" r="4" fill="#3a2810" opacity="0.35"/>
    <circle cx="240" cy="360" r="3" fill="#3a2810" opacity="0.35"/>

    <!-- volcano -->
    <g transform="translate(70, 295)">
      <path d="M 0,28 L 8,4 L 18,4 L 26,28 Z" fill="#8a6230" stroke="#3a2810" stroke-width="2"/>
      <ellipse cx="13" cy="4" rx="5" ry="1.5" fill="#3a2810"/>
    </g>
    <!-- baobab -->
    <g transform="translate(280, 305)">
      <circle cx="4" cy="7" r="5" fill="#5fb37d" stroke="#2a6e3f" stroke-width="1.5"/>
      <circle cx="12" cy="6" r="4.5" fill="#4ca96a" stroke="#2a6e3f" stroke-width="1.5"/>
      <circle cx="8" cy="0" r="4" fill="#5fb37d" stroke="#2a6e3f" stroke-width="1.5"/>
    </g>

    <!-- ROSE -->
    <g transform="translate(50,150) scale(1.15)">
      <path d="M 22,95 Q 14,65 24,35" fill="none" stroke="#2a6e3f" stroke-width="4" stroke-linecap="round"/>
      <path d="M 22,62 Q 40,56 48,68 Q 38,74 22,68 Z" fill="#5fb37d" stroke="#2a6e3f" stroke-width="1.5"/>
      <g transform="translate(28, 5)">
        <path d="M -12,-2 Q -18,-14 -8,-20 Q 0,-24 8,-20 Q 18,-14 12,-2 Q 8,8 0,6 Q -8,8 -12,-2 Z" fill="url(#rose)" stroke="#7a1812" stroke-width="1.5"/>
        <path d="M -8,-2 Q -12,-12 -4,-16 Q 4,-18 10,-12 Q 14,-6 10,-2 Q 5,5 0,4 Q -5,5 -8,-2 Z" fill="#d83a30" stroke="#7a1812" stroke-width="1.2"/>
        <circle cx="0" cy="-3" r="3.5" fill="#7a1812"/>
      </g>
    </g>

    <!-- PRINCE -->
    <g transform="translate(110, 170) scale(1.5)">
      <!-- scarf -->
      <path d="M 32,72 Q 54,68 70,72 Q 96,76 116,90 Q 100,94 84,88 Q 62,92 42,86 L 30,80 Z" fill="url(#scarf)" stroke="#a06800" stroke-width="2"/>
      <!-- legs -->
      <path d="M 20,108 Q 10,128 14,150 L 32,152 Q 36,138 36,118 Z" fill="#5a6a3a" stroke="#2a3418" stroke-width="2"/>
      <path d="M 38,108 Q 50,128 60,140 Q 64,150 50,154 L 28,152 Q 32,135 32,118 Z" fill="#5a6a3a" stroke="#2a3418" stroke-width="2"/>
      <!-- boots -->
      <path d="M 10,148 Q 6,158 14,162 L 32,162 Q 38,156 32,150 Z" fill="#5a3a1a" stroke="#2a1a08" stroke-width="2"/>
      <path d="M 44,152 Q 58,158 64,156 Q 68,160 60,164 L 44,162 Z" fill="#5a3a1a" stroke="#2a1a08" stroke-width="2"/>
      <!-- body -->
      <path d="M 16,55 Q 10,82 16,110 L 52,112 Q 58,82 50,55 Z" fill="url(#jacket)" stroke="#1a2e22" stroke-width="2.2"/>
      <line x1="34" y1="68" x2="34" y2="108" stroke="#1a2e22" stroke-width="1.5"/>
      <!-- arm -->
      <path d="M 50,60 Q 76,72 96,84 Q 104,88 100,94 Q 86,92 68,86 Q 54,80 48,72 Z" fill="url(#jacket)" stroke="#1a2e22" stroke-width="2"/>
      <circle cx="100" cy="92" r="5" fill="url(#skin)" stroke="#a06b3a" stroke-width="1.5"/>
      <!-- head -->
      <path d="M 14,8 Q 12,32 26,52 Q 42,56 56,46 Q 62,28 56,8 Q 38,-2 14,8 Z" fill="url(#skin)" stroke="#a06b3a" stroke-width="2"/>
      <!-- hair -->
      <path d="M 6,18 Q 2,0 16,-4 Q 32,-12 52,-8 Q 66,0 64,20 Q 56,10 48,8 Q 38,4 26,6 Q 16,10 6,18 Z" fill="url(#hair)" stroke="#8a6800" stroke-width="1.6"/>
      <!-- crown -->
      <path d="M 12,-6 L 20,-16 L 28,-10 L 36,-20 L 44,-10 L 52,-16 L 60,-6 L 60,2 L 12,2 Z" fill="#ffd54a" stroke="#8a6800" stroke-width="2"/>
      <circle cx="36" cy="-20" r="3" fill="#e85a4f" stroke="#7a1812" stroke-width="1"/>
      <!-- eyes -->
      <ellipse cx="30" cy="28" rx="2.6" ry="3.2" fill="#1a2e22"/>
      <ellipse cx="46" cy="26" rx="2.6" ry="3.2" fill="#1a2e22"/>
      <circle cx="30.9" cy="27" r="1" fill="#fff"/>
      <circle cx="46.9" cy="25" r="1" fill="#fff"/>
      <ellipse cx="22" cy="38" rx="3.5" ry="2.2" fill="#ff9a8a" opacity="0.55"/>
      <ellipse cx="52" cy="36" rx="3.5" ry="2.2" fill="#ff9a8a" opacity="0.55"/>
      <path d="M 32,42 Q 38,46 44,42" fill="none" stroke="#a04020" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- FOX -->
    <g transform="translate(290, 240) scale(1.5)">
      <!-- tail -->
      <path d="M 48,42 Q 78,32 90,8 Q 94,-4 86,-14 Q 76,2 70,18 Q 60,32 48,42 Z" fill="url(#fox)" stroke="#5a2810" stroke-width="2"/>
      <path d="M 86,-14 Q 94,-12 92,-2 Q 88,2 82,-4 Q 82,-10 86,-14 Z" fill="#fff4e0" stroke="#5a2810" stroke-width="1.5"/>
      <!-- body -->
      <path d="M 6,22 Q -4,42 4,66 Q 12,76 32,76 Q 52,74 56,60 Q 60,42 50,18 Q 30,8 6,22 Z" fill="url(#fox)" stroke="#5a2810" stroke-width="2.2"/>
      <path d="M 16,28 Q 20,38 22,54 Q 22,66 30,70 Q 40,66 38,54 Q 38,38 32,28 Z" fill="#fff4e0" stroke="#5a2810" stroke-width="1.5"/>
      <!-- head -->
      <path d="M 4,-12 Q -10,4 -4,20 Q 10,28 30,24 Q 44,18 46,4 Q 44,-14 30,-20 Q 14,-22 4,-12 Z" fill="url(#fox)" stroke="#5a2810" stroke-width="2"/>
      <!-- ears -->
      <path d="M 0,-12 L -8,-34 L 16,-20 Z" fill="url(#fox)" stroke="#5a2810" stroke-width="1.8"/>
      <path d="M -1,-14 L -3,-26 L 10,-18 Z" fill="#f4a896"/>
      <path d="M 32,-20 L 40,-34 L 44,-12 Z" fill="url(#fox)" stroke="#5a2810" stroke-width="1.8"/>
      <path d="M 34,-20 L 38,-28 L 41,-14 Z" fill="#f4a896"/>
      <!-- snout -->
      <path d="M -4,8 Q 4,20 20,18 Q 22,10 16,2 Q 6,2 -4,8 Z" fill="#fff4e0" stroke="#5a2810" stroke-width="1.5"/>
      <path d="M -8,4 Q -12,10 -10,16 Q -2,20 4,14 Q 2,8 -8,4 Z" fill="#fff4e0" stroke="#5a2810" stroke-width="1.5"/>
      <ellipse cx="-10" cy="8" rx="3" ry="2.4" fill="#1a0a08"/>
      <path d="M -8,12 Q -2,17 6,14" fill="none" stroke="#5a2810" stroke-width="1.5"/>
      <!-- eyes -->
      <ellipse cx="8" cy="-2" rx="3.2" ry="3.6" fill="#1a2e22"/>
      <circle cx="8.8" cy="-3" r="1.2" fill="#fff"/>
      <ellipse cx="26" cy="-4" rx="3.4" ry="3.8" fill="#1a2e22"/>
      <circle cx="26.8" cy="-5" r="1.3" fill="#fff"/>
    </g>
  </g>
</svg>
